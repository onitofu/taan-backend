name: ${PROJECT_NAME:?Set PROJECT_NAME in .env}

services:
    backend:
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            BACKEND_BIND_ADDRESS: ${BACKEND_BIND_ADDRESS:?Set BACKEND_BIND_ADDRESS in .env}
            BACKEND_PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
            DB_HOSTNAME: ${DB_HOSTNAME:?Set DB_HOSTNAME in .env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
            DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:?Set DB_CONNECT_TIMEOUT_SECONDS in .env}
            DB_SOCKET_TIMEOUT_SECONDS: ${DB_SOCKET_TIMEOUT_SECONDS:?Set DB_SOCKET_TIMEOUT_SECONDS in .env}
            BACKEND_MAX_CONNECTIONS: ${BACKEND_MAX_CONNECTIONS:?Set BACKEND_MAX_CONNECTIONS in .env}
            BACKEND_MAX_FRAME_BYTES: ${BACKEND_MAX_FRAME_BYTES:?Set BACKEND_MAX_FRAME_BYTES in .env}
            BACKEND_MAX_PENDING_REQUESTS: ${BACKEND_MAX_PENDING_REQUESTS:?Set BACKEND_MAX_PENDING_REQUESTS in .env}
            BACKEND_WORKER_THREADS: ${BACKEND_WORKER_THREADS:?Set BACKEND_WORKER_THREADS in .env}
            BACKEND_WORK_QUEUE_CAPACITY: ${BACKEND_WORK_QUEUE_CAPACITY:?Set BACKEND_WORK_QUEUE_CAPACITY in .env}
            BACKEND_FRAME_ASSEMBLY_TIMEOUT_SECONDS: ${BACKEND_FRAME_ASSEMBLY_TIMEOUT_SECONDS:?Set BACKEND_FRAME_ASSEMBLY_TIMEOUT_SECONDS in .env}
            BACKEND_REQUEST_TIMEOUT_SECONDS: ${BACKEND_REQUEST_TIMEOUT_SECONDS:?Set BACKEND_REQUEST_TIMEOUT_SECONDS in .env}
            BACKEND_IDLE_TIMEOUT_SECONDS: ${BACKEND_IDLE_TIMEOUT_SECONDS:?Set BACKEND_IDLE_TIMEOUT_SECONDS in .env}
            BACKEND_SHUTDOWN_TIMEOUT_SECONDS: ${BACKEND_SHUTDOWN_TIMEOUT_SECONDS:?Set BACKEND_SHUTDOWN_TIMEOUT_SECONDS in .env}
            ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:?Set ARGON2_MEMORY_KIB in .env}
            ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:?Set ARGON2_ITERATIONS in .env}
            ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:?Set ARGON2_PARALLELISM in .env}
            BACKEND_MAX_PENDING_OUTPUT_BATCHES: ${BACKEND_MAX_PENDING_OUTPUT_BATCHES:?Set BACKEND_MAX_PENDING_OUTPUT_BATCHES in .env}
            BACKEND_MAX_PENDING_OUTPUT_BYTES: ${BACKEND_MAX_PENDING_OUTPUT_BYTES:?Set BACKEND_MAX_PENDING_OUTPUT_BYTES in .env}
            BACKEND_PLAYABLE_TIME_BOOTSTRAP_SECONDS: ${BACKEND_PLAYABLE_TIME_BOOTSTRAP_SECONDS:?Set BACKEND_PLAYABLE_TIME_BOOTSTRAP_SECONDS in .env}
            BACKEND_MATCH_LOADING_TIMEOUT_SECONDS: ${BACKEND_MATCH_LOADING_TIMEOUT_SECONDS:?Set BACKEND_MATCH_LOADING_TIMEOUT_SECONDS in .env}
            BACKEND_MATCH_PREVIEW_TIMEOUT_SECONDS: ${BACKEND_MATCH_PREVIEW_TIMEOUT_SECONDS:?Set BACKEND_MATCH_PREVIEW_TIMEOUT_SECONDS in .env}
            BACKEND_MATCH_ACTION_TIMEOUT_SECONDS: ${BACKEND_MATCH_ACTION_TIMEOUT_SECONDS:-20}
            BACKEND_MATCH_COMPLETION_GRACE_SECONDS: ${BACKEND_MATCH_COMPLETION_GRACE_SECONDS:-10}
            BACKEND_MATCH_REPORTS_PER_SECOND: ${BACKEND_MATCH_REPORTS_PER_SECOND:?Set BACKEND_MATCH_REPORTS_PER_SECOND in .env}
            BACKEND_MATCH_WORKER_THREADS: ${BACKEND_MATCH_WORKER_THREADS:?Set BACKEND_MATCH_WORKER_THREADS in .env}
            BACKEND_MATCH_QUEUE_CAPACITY: ${BACKEND_MATCH_QUEUE_CAPACITY:?Set BACKEND_MATCH_QUEUE_CAPACITY in .env}
            LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
            LOG_WARN_BURST: ${LOG_WARN_BURST:?Set LOG_WARN_BURST in .env}
            LOG_WARN_INTERVAL_SECONDS: ${LOG_WARN_INTERVAL_SECONDS:?Set LOG_WARN_INTERVAL_SECONDS in .env}
        ports:
            - target: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
              published: "${BACKEND_PORT:?Set BACKEND_PORT in .env}"
              host_ip: ${BACKEND_HOSTNAME:?Set BACKEND_HOSTNAME in .env}
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        build:
            context: .
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        stop_grace_period: 30s

    postgres:
        image: postgres:18-bookworm
        user: postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - target: 5432
              published: "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"
              host_ip: ${POSTGRES_HOSTNAME:?Set POSTGRES_HOSTNAME in .env}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        restart: "no"
        stop_grace_period: 30s

volumes:
    postgres-data:
