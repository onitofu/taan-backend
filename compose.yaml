name: ${PROJECT_NAME:?Set PROJECT_NAME in .env}

services:
    backend:
        build:
            context: .
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        stop_grace_period: 30s

    postgres:
        image: postgres:18-bookworm
        user: postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - target: 5432
              published: "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"
              host_ip: ${POSTGRES_HOSTNAME:?Set POSTGRES_HOSTNAME in .env}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        restart: "no"
        stop_grace_period: 30s

volumes:
    postgres-data:
