name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify
        id: verify
        run: ./mvnw clean verify

      - name: Generate missing coverage report after failure
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        run: |
          if [[ -f target/jacoco.exec && -d target/classes && ! -f target/site/jacoco/jacoco.xml ]]; then
            ./mvnw jacoco:report@coverage-report
          fi

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 3
          if-no-files-found: ${{ steps.verify.outcome == 'success' && 'error' || 'warn' }}
